services:
  - type: web
    name: sound-provider-service
    runtime: node
    plan: free
    rootDir: sps-app-v2
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_PATH
        value: /tmp/data.sqlite3
      - key: PAYMENT_MODE
        value: mock
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        sync: false
      - key: ADMIN_PHONE
        sync: false
